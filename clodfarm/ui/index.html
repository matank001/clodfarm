<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4f6b25">
<meta name="robots" content="noindex, nofollow">
<title>clodfarm</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/PressStart2P.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div id="labels" aria-hidden="true"></div>

<!-- ============================== title screen ============================== -->
<main id="title" class="screen" hidden>
  <div class="title-card">
    <h1 class="logo"><span>CLOD</span><span>FARM</span></h1>
    <p class="tagline">a farm of Claude Code agents</p>
    <form id="login-form" class="panel login" autocomplete="on">
      <input name="user" autocomplete="username" value="clodfarm" hidden>
      <label>PASSWORD<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn primary" type="submit">▶ ENTER THE FARM</button>
    </form>
    <p class="hint blink">PRESS START</p>
  </div>
</main>

<!-- ================================ the farm ================================ -->
<div id="hud" hidden>
  <div class="chips" id="chips" aria-live="polite"></div>


  <div class="toolbar" role="toolbar" aria-label="Farm actions">
    <a class="talk-hint" id="talk-hint" href="https://claude.ai/code" target="_blank" rel="noopener noreferrer" title="Talk to your Claude in the Claude app">
      <b>TALK TO YOUR CLAUDE</b>
      <span>Open the <strong>Claude app</strong> → <strong>Code</strong> → <strong id="talk-name">clodfarm</strong> and ask it anything. It can start sub-workers, hand work to the other Claudes and schedule tasks.</span>
    </a>
    <button type="button" class="tool wide-tool" data-act="hatch" title="Add a new Claude (C)"><img alt="" data-icon="egg"><span>+ NEW CLAUDE</span></button>
  </div>

  <div id="textbox" class="textbox" role="status" aria-live="polite">
    <p id="textbox-text"></p><span class="more" aria-hidden="true">▼</span>
  </div>
</div>

<!-- ================================= dialogs ================================= -->
<dialog id="dlg-summary" class="panel dlg" aria-labelledby="sum-name">
  <div class="sum-head">
    <canvas class="sum-sprite" id="sum-sprite" width="32" height="32" aria-hidden="true"></canvas>
    <div>
      <h2 id="sum-name">CLAUDE</h2>
      <p class="muted" id="sum-sub"></p>
    </div>
  </div>
  <div id="sum-body"></div>
  <div class="dlg-actions" id="sum-actions"></div>
  <button class="x" type="button" data-close aria-label="Close">✕</button>
</dialog>

<dialog id="dlg-hatch" class="panel dlg" aria-labelledby="hatch-h">
  <h2 id="hatch-h">NEW CLAUDE</h2>
  <div id="hatch-body"></div>
  <button class="x" type="button" data-close aria-label="Close">✕</button>
</dialog>

</body>
</html>
