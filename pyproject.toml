[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clodfarm"
dynamic = ["version"]
description = "Always-on Claude Code agents in a container: Remote Control, sub-agents, a shared queue, and a budget governor that paces each account on its real 5-hour and weekly usage."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Matan Kotick"}]
keywords = ["claude", "claude-code", "ai-agents", "autonomous-agents", "multi-agent", "agent-orchestration",
            "remote-control", "subagents", "rate-limit", "budget", "dynamodb", "docker", "devops", "llm"]
dependencies = ["boto3>=1.28"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7", "moto[dynamodb,server]>=5"]

[project.scripts]
clodfarm = "clodfarm.cli:main"

[project.urls]
Homepage = "https://github.com/matank001/clodfarm"
Documentation = "https://github.com/matank001/clodfarm/tree/main/docs"
Issues = "https://github.com/matank001/clodfarm/issues"
Changelog = "https://github.com/matank001/clodfarm/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["clodfarm"]

[tool.setuptools.dynamic]
version = {attr = "clodfarm.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
