<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4f6b25">
<meta name="robots" content="noindex, nofollow">
<title>clodfarm</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/PressStart2P.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div id="labels" aria-hidden="true"></div>

<!-- ============================== title screen ============================== -->
<main id="title" class="screen" hidden>
  <div class="title-card">
    <h1 class="logo"><span>CLOD</span><span>FARM</span></h1>
    <p class="tagline">a farm of Claude Code agents</p>
    <form id="login-form" class="panel login" autocomplete="on">
      <input name="user" autocomplete="username" value="clodfarm" hidden>
      <label>PASSWORD<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn primary" type="submit">▶ ENTER THE FARM</button>
    </form>
    <p class="hint blink">PRESS START</p>
  </div>
</main>

<!-- ================================ the farm ================================ -->
<div id="hud" hidden>
  <div class="chips" id="chips" aria-live="polite"></div>


  <div class="toolbar" role="toolbar" aria-label="Farm actions">
    <button type="button" class="tool mini" data-act="talk" id="talk-tool" data-tip="Talk to your Claude" data-key="T" aria-label="Talk to your Claude (T)"><img alt="" data-icon="chat"></button>
    <button type="button" class="tool mini slack-tool" data-act="slack" id="slack-tool" data-tip="Connect Slack" data-key="S" aria-label="Connect Slack (S)"><img alt="" src="slack.svg"></button>
    <a class="tool mini" href="dashboards" id="dash-tool" data-tip="Dashboards and stats" data-key="D" aria-label="Dashboards and stats (D)"><img alt="" data-icon="chart"></a>
    <a class="tool mini" href="tasks" id="tasks-tool" data-tip="Tasks and schedules" data-key="J" aria-label="Tasks and schedules (J)"><img alt="" data-icon="tasks"></a>
    <a class="tool mini" href="browser" id="browser-tool" data-tip="The farm's browser" data-key="B" aria-label="The farm's browser (B)"><img alt="" data-icon="globe"></a>
    <button type="button" class="tool wide-tool" data-act="hatch" data-tip="Add a Claude or a bot" data-key="C" aria-label="Add a Claude or a bot (C)"><img alt="" data-icon="egg"><span>+ NEW CLAUDE</span></button>
  </div>

  <div id="textbox" class="textbox" role="status" aria-live="polite">
    <p id="textbox-text"></p><span class="more" aria-hidden="true">▼</span>
  </div>
</div>

<!-- ================================= dialogs ================================= -->
<dialog id="dlg-summary" class="panel dlg" aria-labelledby="sum-name">
  <div class="sum-head">
    <canvas class="sum-sprite" id="sum-sprite" width="32" height="32" aria-hidden="true"></canvas>
    <div>
      <h2 id="sum-name">CLAUDE</h2>
      <p class="muted" id="sum-sub"></p>
    </div>
  </div>
  <div id="sum-body"></div>
  <div class="dlg-actions" id="sum-actions"></div>
  <button class="x" type="button" data-close aria-label="Close">✕</button>
</dialog>

<dialog id="dlg-talk" class="panel dlg wide" aria-labelledby="talk-h">
  <p class="kicker" id="talk-kicker"></p>
  <h2 id="talk-h"></h2>
  <div id="talk-body" class="talk"></div>
  <div class="dlg-actions" id="talk-actions"></div>
  <button class="x" type="button" data-close aria-label="Close">✕</button>
</dialog>

<dialog id="dlg-hatch" class="panel dlg" aria-labelledby="hatch-h">
  <h2 id="hatch-h">NEW CLAUDE</h2>
  <div id="hatch-body"></div>
  <button class="x" type="button" data-close aria-label="Close">✕</button>
</dialog>

<dialog id="dlg-claude" class="panel dlg" aria-labelledby="claude-h">
  <h2 id="claude-h">TALK TO YOUR CLAUDE</h2>
  <div id="claude-body"></div>
  <div class="dlg-actions" id="claude-actions"></div>
  <button class="x" type="button" data-close aria-label="Close" autofocus>✕</button>
</dialog>

<dialog id="dlg-slack" class="panel dlg" aria-labelledby="slack-h">
  <h2 id="slack-h">SLACK</h2>
  <div id="slack-body"></div>
  <button class="x" type="button" data-close aria-label="Close">✕</button>
</dialog>

</body>
</html>
