# One container, zero config:   docker compose up -d, then open http://localhost:8080 (login printed in `docker logs clodfarm`)
# Settings are optional: copy .env.example to .env to change any of them.
# Several boxes / accounts in one farm: set FARM_STORE=dynamodb and FARM_TABLE (docs/multi-seat.md).
name: clodfarm

services:
  clodfarm:
    image: ghcr.io/matank001/clodfarm:latest
    build: .
    container_name: clodfarm
    hostname: ${FARM_NAME:-clodfarm}   # the device name shown in the Claude app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FARM_CONTAINER_NAME: clodfarm
    ports:
      - "127.0.0.1:${FARM_UI_PORT:-8080}:8080"   # the farm UI; localhost only (put a TLS proxy in front to expose it)
    volumes:
      - claude-home:/home/farm/.claude   # your login and Claude Code state
      - workspace:/workspace             # the repo the agents work in, and the farm's SQLite store
    stop_grace_period: 30s

volumes:
  claude-home:
  workspace:
